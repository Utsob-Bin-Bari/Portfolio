<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FCA61F" />
    <meta
      name="description"
      content="Md. Utsob Bin Bari — Software Engineer specialising in React Native and cross-platform mobile applications. Production apps shipped to the App Store and Google Play across fintech, edtech, e-commerce and live sports streaming."
    />
    <meta name="author" content="Md. Utsob Bin Bari" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="canonical" href="https://utsobbinbariportfolio.netlify.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://utsobbinbariportfolio.netlify.app/" />
    <meta
      property="og:title"
      content="Md. Utsob Bin Bari — React Native Engineer"
    />
    <meta
      property="og:description"
      content="React Native engineer with end-to-end ownership from design implementation through development, optimisation, CI/CD and store deployment."
    />

    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Md. Utsob Bin Bari — React Native Engineer"
    />
    <meta
      name="twitter:description"
      content="React Native engineer with end-to-end ownership from design implementation through development, optimisation, CI/CD and store deployment."
    />
    <!-- Start the font download straight away, in parallel with the JS bundle,
         instead of waiting for React to render text that uses it. -->
    <link
      rel="preload"
      href="%PUBLIC_URL%/fonts/arima-madurai-regular-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Pick the theme before first paint so the splash never flashes the
         wrong colour. A saved toggle choice wins over the OS preference.
         src/Context.js reads data-theme back as its initial state. -->
    <script>
      (function () {
        var theme;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <style>
    @font-face {
      font-family: 'Arima Madurai Regular';
      src: url('%PUBLIC_URL%/fonts/arima-madurai-regular-latin.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    *{
      font-family: 'Arima Madurai Regular', sans-serif;
      font-weight: normal;
      font-size: 20px;
    }
    body{
      margin: 0;
    }
    html[data-theme="dark"] body,
    html[data-theme="dark"] #splash {
      background: #0d1020;
    }

    /* Shown until index.js has the font and has rendered the app. */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #fff;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #splash.splash-hidden {
      opacity: 0;
      visibility: hidden;
    }
    #splash span {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: linear-gradient(180deg, #fdc50f 26.71%, #fb982f 99.36%);
      animation: splash-bounce 1.2s ease-in-out infinite;
    }
    #splash span:nth-child(2) { animation-delay: 0.15s; }
    #splash span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes splash-bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash span { animation: none; }
    }
    </style>
    <noscript><style>#splash { display: none; }</style></noscript>
    <title>Md. Utsob Bin Bari — React Native Engineer</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="splash" role="status" aria-label="Loading">
      <span></span><span></span><span></span>
    </div>
    <div id="root"></div>
  </body>
</html>
